<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campanha de Livros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h1>Campanha Solidária</h1>
        <p>Faça login para acessar sua equipe e missões.</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="usuario@exemplo.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="********" required>
            </div>

            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <div class="footer-links">
            <p>Ainda não tem equipe? <a href="pages/cadastro-login/cadastro.html">Cadastre-se</a></p>
        </div>
    </div>

    <script src="mock-data.js"></script>
    <script src="auth.js"></script>
</body>
</html>
