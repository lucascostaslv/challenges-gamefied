<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="app-header">
        <h2>Mural da Leitura</h2>
        <i class="fas fa-comments" style="color: var(--primary);"></i>
    </header>

    <main class="content-container">
        <div class="compose-card">
            <div class="compose-header">
                <div class="avatar-circle user-avatar">Eu</div>
                <span class="compose-title">O que você está lendo?</span>
            </div>
            <textarea id="postInput" placeholder="Conte para sua equipe..."></textarea>
            <div class="compose-actions">
                <button id="btnPost" class="btn-publish">
                    Publicar <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <div id="feedList" class="feed-container">
            </div>
    </main>

    <nav class="bottom-nav">
        <a href="../missions/missions.html" class="nav-item">
            <i class="fas fa-scroll"></i>
            <span>Missões</span>
        </a>

        <a href="../ranking/ranking.html" class="nav-item">
            <i class="fas fa-trophy"></i>
            <span>Ranking</span>
        </a>

        <a href="#" class="nav-item active">
            <i class="fas fa-users"></i>
            <span>Comun.</span>
        </a>

        <a href="../perfil/perfil.html" class="nav-item">
            <i class="fas fa-user-circle"></i>
            <span>Perfil</span>
        </a>

        <a href="../../index.html" class="nav-item">
            <i class="fas fa-sign-out-alt"></i>
            <span>Sair</span>
        </a>
    </nav>

    <script src="../../mock-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
